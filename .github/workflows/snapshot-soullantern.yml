name: Snapshot Soul Lantern Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-soullantern
  cancel-in-progress: false

env:
  EVENT_DIR: soullantern

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # Roster point history for the per-member deltas — kept in the Actions cache, not on gh-pages.
      - name: Restore roster history
        uses: actions/cache/restore@v4
        with:
          path: roster-state
          key: roster-${{ env.EVENT_DIR }}-${{ github.run_id }}
          restore-keys: roster-${{ env.EVENT_DIR }}-

      - name: Record and push snapshot (retries on conflict)
        env:
          ROSTER_STATE_FILE: roster-state/${{ env.EVENT_DIR }}.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node .github/scripts/snapshot-clanbattle.mjs "$EVENT_DIR"
          [ -f "$EVENT_DIR/history.json" ] || { echo "No data recorded yet."; exit 0; }
          DATA_FILES="history.json players.json rosters.json resolved_names.json event.json"
          mkdir -p /tmp/snap
          for f in $DATA_FILES; do cp "$EVENT_DIR/$f" "/tmp/snap/$f"; done
          for i in 1 2 3 4 5; do
            for f in $DATA_FILES; do
              # names: merge with whatever is on gh-pages now (e.g. a name backfill), never overwrite
              if [ "$f" = resolved_names.json ]; then
                node .github/scripts/merge-names.mjs "/tmp/snap/$f" "$EVENT_DIR/$f" || cp "/tmp/snap/$f" "$EVENT_DIR/$f"
              else
                cp "/tmp/snap/$f" "$EVENT_DIR/$f"
              fi
              git add -f "$EVENT_DIR/$f"
            done
            git diff --cached --quiet && exit 0
            git commit -m "chore: snapshot $EVENT_DIR data"
            git push && exit 0
            echo "Push rejected — retrying from latest gh-pages"
            git reset --hard HEAD~1
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
          done
          echo "::error::Failed to push snapshot after 5 attempts"
          exit 1

      - name: Save roster history
        if: always() && hashFiles('roster-state/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: roster-state
          key: roster-${{ env.EVENT_DIR }}-${{ github.run_id }}
