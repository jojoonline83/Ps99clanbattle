name: Snapshot League Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Record and push snapshot (retries on conflict)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            node .github/scripts/snapshot-league.mjs
            node .github/scripts/snapshot-league-event.mjs spacemining || echo "::warning::spacemining snapshot failed"
            git add -f luckyblox2/league_history.json luckyblox2/resolved_names.json
            git add -f luckyblox2/alert_state.json 2>/dev/null || true
            git add -f spacemining/league_history.json spacemining/resolved_names.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -m "chore: snapshot league data"
            git push && exit 0
            echo "Push rejected — retrying from latest gh-pages"
            git reset --hard HEAD~1
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
          done
          echo "::error::Failed to push snapshot after 5 attempts"
          exit 1

  # Relay the same 10-minute dispatch to the clan battle snapshot workflows.
  # github.token can dispatch workflows in this repo (workflow_dispatch is exempt
  # from the GITHUB_TOKEN no-retrigger rule). Add new event workflows to WORKFLOWS.
  relay-clan-battles:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      WORKFLOWS: snapshot-soullantern.yml
    steps:
      - name: Dispatch clan battle snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in $WORKFLOWS; do
            gh workflow run "$wf" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
              && echo "Dispatched $wf" || echo "::warning::Failed to dispatch $wf"
          done
