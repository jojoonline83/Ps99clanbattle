<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>PS99 Clan Battle Lucky Blox &#8212; Blox Stages</title>
    <link rel="stylesheet" href="style.css?v=5">
    <script>
    (function(){
        var V = 5;
        var k = '_ps99cb_clanbattle_stages_v';
        var stored = localStorage.getItem(k);
        localStorage.setItem(k, V);
        if (stored && stored !== String(V)) {
            var url = location.href.split('?')[0] + '?nocache=' + V;
            location.replace(url);
        }
    })();
    </script>
</head>
<body>

<header>
    <div class="header-content">
        <div class="logo">
            <span class="logo-icon">&#127882;</span>
            <h1>PS99 Clan Battle Lucky Blox &#8212; Blox Stages</h1>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
            <span id="event-status-badge"></span>
            <button class="btn-refresh" id="refresh-btn">&#128260; Refresh</button>
        </div>
    </div>
</header>

<nav class="page-nav">
    <a href="index.html" class="nav-tab">Clan Leaderboard</a>
    <a href="stages.html" class="nav-tab active">Blox Stages</a>
</nav>

<main>

    <!-- Stages Leaderboard -->
    <div id="leaderboard-view" class="view active">
        <div class="event-info-bar">
            <div>
                <div class="event-title">Blox Stage Leaderboard</div>
                <div class="event-dates">All players ranked by rebirth &amp; stage progress</div>
            </div>
        </div>

        <div class="manage-card live-card">
            <div class="manage-card-header">
                <h3>&#128269; Search Player</h3>
                <span class="live-dot"></span>
            </div>
            <p class="live-desc">Search by player name, user ID, or clan name.</p>
            <div class="live-manual">
                <input type="text" id="search-player-name" class="live-input" placeholder="Enter player name">
                <button class="btn-live-secondary" id="search-player-btn">Search</button>
                <button class="btn-secondary" id="clear-search-btn" style="display:none">Clear</button>
            </div>
            <div id="search-status" class="import-status"></div>
        </div>

        <h3 class="sub-heading" id="leaderboard-heading">Top Players by Stage</h3>
        <div class="players-table-container">
            <table class="players-table">
                <thead>
                    <tr><th>#</th><th>Display Name</th><th>Clan</th><th>Rebirth</th><th>Stage</th><th>Stages</th><th>Points</th><th>&Delta;10m</th><th>&Delta;30m</th><th>&Delta;1Hr</th></tr>
                </thead>
                <tbody id="leaderboard-tbody"></tbody>
            </table>
        </div>
    </div>

</main>

<div id="toast" class="toast"></div>

<script src="stages.js?v=5"></script>
</body>
</html>
